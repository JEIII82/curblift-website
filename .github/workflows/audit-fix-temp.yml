name: Temporary audit lockfile fix

on:
  push:
    branches:
      - production-security-audit

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: production-security-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update vulnerable locked dependencies
        run: npm audit fix --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update audited dependency lockfile"
          git push
