name: Site CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Lighthouse production audit
        run: |
          npx --yes lighthouse https://rinsepoint.com/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=./lighthouse.json --quiet
          node --input-type=commonjs -e "const r=require('./lighthouse.json'); const c=r.categories; const a=r.audits; console.log('PERFORMANCE',Math.round(c.performance.score*100)); console.log('ACCESSIBILITY',Math.round(c.accessibility.score*100)); console.log('BEST_PRACTICES',Math.round(c['best-practices'].score*100)); console.log('SEO',Math.round(c.seo.score*100)); console.log('LCP',a['largest-contentful-paint'].displayValue); console.log('TBT',a['total-blocking-time'].displayValue); console.log('CLS',a['cumulative-layout-shift'].displayValue); console.log('FCP',a['first-contentful-paint'].displayValue); const d=a.diagnostics?.details?.items?.[0]||{}; console.log('TOTAL_BYTES',d.totalByteWeight); console.log('SCRIPTS',d.numScripts); console.log('MAIN_THREAD_MS',d.totalTaskTime); const keys=['unused-javascript','unused-css-rules','render-blocking-resources','uses-optimized-images','uses-responsive-images','uses-webp-images','modern-image-formats','offscreen-images','server-response-time','mainthread-work-breakdown','bootup-time','dom-size']; for(const k of keys){if(a[k]) console.log('AUDIT',k,'score='+a[k].score,'value='+a[k].displayValue,'saveMs='+(a[k].details?.overallSavingsMs||0),'saveBytes='+(a[k].details?.overallSavingsBytes||0));} const req=(a['network-requests']?.details?.items||[]).sort((x,z)=>(z.transferSize||0)-(x.transferSize||0)).slice(0,8); for(const x of req) console.log('REQUEST',x.transferSize,x.resourceType,x.url);"
